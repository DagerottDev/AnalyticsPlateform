# Local developer override. Compose this on top of docker-compose.yml once:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up
#
# The production compose file intentionally uses built images. This override
# mounts both source trees and replaces those processes with development
# servers, so save events hot-reload without image rebuilds.
services:
  backend:
    image: oap-backend-dev
    build:
      target: development
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
    volumes:
      - ../backend:/app
      - backend_venv:/app/.venv

  frontend:
    image: oap-frontend-dev
    build:
      target: development
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  backend_venv:
  frontend_node_modules:
  frontend_next:
