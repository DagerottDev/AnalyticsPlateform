name: CI — Option Analytics Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan reachable Git history
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100'
      - name: Scan tracked files and vendored archives
        run: |
          mkdir "$RUNNER_TEMP/secret-scan-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/secret-scan-tree"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/secret-scan-tree" --config=.gitleaks.toml --max-archive-depth=2 --redact=100

  # ─── Backend ───────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Verify reproducible broker SDK patch
        run: |
          curl -fsSL https://files.pythonhosted.org/packages/24/dc/553a556fb6dd4b2e4d4251d5ec53536a36cde34f9aae8aaf88280239a5bb/fyers_apiv3-3.1.14-py3-none-any.whl -o "$RUNNER_TEMP/fyers-upstream.whl"
          python ../scripts/build-fyers-wheel.py "$RUNNER_TEMP/fyers-upstream.whl" "$RUNNER_TEMP/fyers-patched.whl"
          cmp vendor/fyers_apiv3-3.1.14+oap.1-py3-none-any.whl "$RUNNER_TEMP/fyers-patched.whl"

      - name: Lint with Ruff
        run: poetry run ruff check .

      - name: Type check with MyPy
        run: poetry run mypy app/ --ignore-missing-imports

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: isolated-ci-signing-secret-at-least-32-characters
          APP_ENV: development
        run: poetry run pytest -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ─── Frontend ──────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify reproducible lint dependency patch
        run: |
          curl -fsSL https://registry.npmjs.org/braces/-/braces-3.0.3.tgz -o "$RUNNER_TEMP/braces-upstream.tgz"
          python3 ../scripts/build-braces-package.py "$RUNNER_TEMP/braces-upstream.tgz" "$RUNNER_TEMP/braces-patched.tgz"
          cmp vendor/braces-3.0.3-oap.1.tgz "$RUNNER_TEMP/braces-patched.tgz"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --reporter=verbose

  # ─── Docker ────────────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t oap-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t oap-frontend:ci ./frontend

      - name: Verify backend health
        run: |
          docker network create oap-ci
          docker run -d --name oap-ci-db --network oap-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=option_analytics timescale/timescaledb:latest-pg16
          docker run -d --name oap-ci-redis --network oap-ci redis:7-alpine
          docker run -d --name backend-test --network oap-ci -p 127.0.0.1:8000:8000 \
            -e JWT_SECRET=isolated-ci-signing-secret-at-least-32-characters -e APP_ENV=development \
            -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@oap-ci-db:5432/option_analytics \
            -e REDIS_URL=redis://oap-ci-redis:6379/0 \
            -e MARKET_DATA_BACKFILL_ENABLED=false -e IV_UNIVERSE_BACKFILL_ENABLED=false \
            -e PARTICIPANT_DATA_ENABLED=false -e ALERT_EVALUATION_ENABLED=false \
            -e BASKET_MONITOR_ENABLED=false -e OPEN_INTEREST_SNAPSHOT_ENABLED=false \
            oap-backend:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/v1/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/v1/auth/auto-login)" = 403
          docker run -d --name frontend-test -p 127.0.0.1:3000:3000 oap-frontend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/accounts > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/accounts > /dev/null

      - name: Container diagnostics
        if: failure()
        run: |
          docker logs backend-test || true
          docker logs frontend-test || true
