[tool.poetry]
name = "option-analytics-backend"
version = "0.1.1"
description = "FastAPI backend for Option Analytics Platform with native Fyers broker integration"
authors = ["Option Analytics Team"]
license = "MIT"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.156.4"
starlette = ">=1.3.1,<2"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
pyjwt = "^2.15.1"
httpx = "^0.28.0"
fyers-apiv3 = {path = "vendor/fyers_apiv3-3.1.14+oap.1-py3-none-any.whl"}
sqlalchemy = "^2.0.0"
asyncpg = "^0.30.0"
greenlet = "^3.1.0"
alembic = "^1.14.0"
python-multipart = "^0.0.31"
pyotp = "^2.9.0"
certifi = "^2026.10.19"
requests = "^2.34.2"
cryptography = "^50.0.2"
sentry-sdk = {extras = ["fastapi"], version = "^2.0.0"}
redis = ">=5.0"
nselib = "^2.5.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^6.0.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
types-requests = "^2.32.0"
aiosqlite = "^0.22.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
# B008: FastAPI's Depends()-as-default-argument is the framework's own idiom, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# alembic/env.py sets up sys.path before importing app modules; migration scripts are
# generated, not hand-styled.
"alembic/env.py" = ["E402"]
"alembic/versions/*.py" = ["E501", "W291"]
# S/K/T/r/sigma are the standard Black-Scholes variable names, matching
# frontend/src/lib/greeks.ts one-for-one so the two stay easy to diff.
"app/services/greeks.py" = ["N803"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"
