[tool.poetry]
name = "option-analytics-backend"
version = "0.1.0"
description = "FastAPI backend for Option Analytics Platform with native Fyers/Zerodha broker integration"
authors = ["Option Analytics Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
httpx = "^0.28.0"
fyers-apiv3 = "^3.1.2"
kiteconnect = "^5.0.1"
redis = {extras = ["hiredis"], version = "^5.2.0"}
sqlalchemy = "^2.0.0"
asyncpg = "^0.30.0"
greenlet = "^3.1.0"
alembic = "^1.14.0"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
ruff = "^0.8.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
# B008: FastAPI's Depends()-as-default-argument is the framework's own idiom, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# alembic/env.py sets up sys.path before importing app modules; migration scripts are
# generated, not hand-styled.
"alembic/env.py" = ["E402"]
"alembic/versions/*.py" = ["E501", "W291"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"
